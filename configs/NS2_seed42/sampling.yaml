project_root: ../..
experiment_name: NS2_IV_LowSusceptibility
input:
  boundary: data/zixing_prj.shp
  water: data/zixing_water_prj.shp
  historical_landslide_buffer: data/historical_landslides_buffer25m.shp
positive_samples:
  path: data/samples/positive_samples.gpkg
factors:
  directory: data/factors
  continuous:
  - Curvature
  - DTF
  - DTR
  - DTW
  - Elevation
  - NDVI
  - Relief
  - Slope
  - TWI
  categorical:
  - Aspect
  - Landuse
  - Lithology
  feature_order:
  - Aspect
  - Curvature
  - DTF
  - DTR
  - DTW
  - Elevation
  - Landuse
  - Lithology
  - NDVI
  - Relief
  - Slope
  - TWI
  files:
    Aspect: Aspect.tif
    Curvature: Curvature.tif
    DTF: DTF.tif
    DTR: DTR.tif
    DTW: DTW.tif
    Elevation: Elevation.tif
    Landuse: Landuse.tif
    Lithology: Lithology.tif
    NDVI: NDVI.tif
    Relief: Relief.tif
    Slope: Slope.tif
    TWI: TWI.tif
reclassification:
  Elevation:
    method: fixed_breaks
    breaks:
    - 200
    - 400
    - 600
    - 800
    - 1000
    - 1200
    - 1400
  Slope:
    method: fixed_breaks
    breaks:
    - 10
    - 20
    - 30
    - 40
    - 50
    - 60
  DTR:
    method: fixed_breaks
    breaks:
    - 600
    - 1200
    - 2000
    - 3500
    - 4500
  DTF:
    method: fixed_breaks
    breaks:
    - 500
    - 1000
    - 1500
    - 2000
    - 3000
    - 4000
  Curvature:
    method: fixed_breaks
    breaks:
    - -6
    - -4
    - -2
    - -1
    - 1
    - 2
    - 4
    - 6
  Relief:
    method: fixed_breaks
    breaks:
    - 6
    - 12
    - 18
    - 25
    - 35
  DTW:
    method: fixed_breaks
    breaks:
    - 1000
    - 2500
    - 4000
    - 5500
    - 8000
  NDVI:
    method: fixed_breaks
    breaks:
    - 0.1
    - 0.31
    - 0.46
    - 0.54
  TWI:
    method: fixed_breaks
    breaks:
    - 4.74
    - 7.46
    - 12.78
    - 17.87
information_value:
  smoothing:
    enabled: true
    alpha: 0.5
low_susceptibility:
  method: quantile
  quantile: 0.3
sampling:
  sample_count_mode: auto
  manual_sample_count: null
  random_seed: 42
  one_negative_per_raster_cell: true
reference_raster: Aspect
data_quality:
  stop_on_raster_misalignment: true
  stop_on_invalid_positive_sample: true
  stop_on_empty_class: false
diagnostics:
  low_landslide_count_threshold: 3
  small_area_ratio_threshold: 0.001
  extreme_iv_abs_threshold: 5.0
processing:
  chunk_rows: 128
  write_iv_factors: true
comparison: {}
output:
  root: outputs/NS2_seed42/sampling
